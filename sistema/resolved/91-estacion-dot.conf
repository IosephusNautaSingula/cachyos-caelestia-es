# /etc/systemd/resolved.conf.d/91-estacion-dot.conf (opcional): DNS cifrado (DNS over TLS) con Cloudflare y, de
# respaldo, Quad9. «opportunistic»: cifra si puede; si una red (portal cautivo de hotel) lo bloquea, cae a DNS normal
# en vez de dejarle sin conexión. Los nombres .local (NAS) siguen por mDNS. Cambie los servidores a su gusto.
[Resolve]
DNS=1.1.1.1#cloudflare-dns.com 1.0.0.1#cloudflare-dns.com 2606:4700:4700::1111#cloudflare-dns.com
FallbackDNS=9.9.9.9#dns.quad9.net 2620:fe::9#dns.quad9.net
DNSOverTLS=opportunistic
Domains=~.
