# Estación: touchpad I2C-HID en el initramfs (plataformas Intel Tiger Lake; el instalador solo lo aplica si detecta
# el touchpad configurado Y el controlador de pines pinctrl_tigerlake).
# Causa del problema que evita: en algunos portátiles Lenovo, si el touchpad no se ha inicializado a los ~8 s del
# arranque, el kernel desactiva la IRQ de su controlador I2C («irq N: nobody cared») y luego el touchpad da
# «controller timed out» (-110). Con el disco cifrado los módulos se cargaban tras pedir la frase, demasiado tarde.
# Con estos módulos el touchpad se inicializa en el initramfs, antes de pedir la frase.
# En otras plataformas Intel el módulo de pines es otro (p. ej. pinctrl_alderlake): adapte la lista a mano.
MODULES+=(pinctrl_tigerlake intel_lpss_pci i2c_hid_acpi hid_multitouch)
