# /etc/sysctl.d/90-estacion.conf — endurecimiento razonable para un portátil de escritorio. Solo ajustes que no rompen
# nada habitual. NO se tocan: espacios de nombres de usuario (los usan Electron, VS Code, Spotify y Flatpak) ni ptrace.

# Impide crear/abrir FIFOs y ficheros ajenos en directorios con sticky bit escribibles por todos (/tmp): evita ataques
# de suplantación de ficheros. Muchas distribuciones dejan 1 (solo FIFOs/ficheros de grupo); 2 lo amplía a todos.
fs.protected_fifos = 2
fs.protected_regular = 2

# No cargar disciplinas de línea TTY bajo demanda (vía clásica de escalada con módulos raros del kernel).
dev.tty.ldisc_autoload = 0

# Un portátil no es un router: no enviar redirecciones ICMP ni aceptar las «seguras».
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0

# Prohibir cargar otro kernel en caliente con kexec (si no lo usa; lo aprovechan rootkits). Irreversible hasta
# reiniciar.
kernel.kexec_load_disabled = 1
